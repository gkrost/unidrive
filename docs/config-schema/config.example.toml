# unidrive config.toml. Copy to the config directory and edit.
# Keys mirror config.schema.json; every key is optional.

[general]
# default_profile = "internxt"
# poll_interval = 60
# conflict_policy = "keep_both"        # keep_both | last_writer_wins
# sync_direction = "bidirectional"     # bidirectional | upload | download
# exclude_patterns = ["/dev/git/**"]   # ignored in both directions

[providers.internxt]
type = "internxt"
# On Windows write paths with forward slashes ("C:/Users/me/Internxt"), doubled backslashes
# ("C:\\Users\\me\\Internxt") or a single-quoted literal string ('C:\Users\me\Internxt').
sync_root = "~/Internxt"

# Sync only these remote subtrees. Nothing else materializes under sync_root.
# A single path or a list; entries are absolute remote paths starting with "/".
# Absent = the whole drive. `unidrive sync --sync-path ...` overrides it for one run.
# sync_path = "/_INBOX"
# sync_path = ["/_INBOX", "/gernot_ssh"]

# Budget of the hydration cache (what reads and writes through the mount leave under
# ~/.cache/unidrive/hydration/<profile>), in bytes. Eviction never touches a file with an open
# handle, a queued or failed upload, an unfinished create or an unsynced edit. 0 = unlimited.
# Default 21474836480 (20 GiB). `unidrive doctor` shows the size against the budget.
# hydration_cache_max_bytes = 21474836480

# exclude_patterns = ["/dev/git/**"]
