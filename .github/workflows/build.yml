name: build

on:
  push:
    branches: [main, evolve/mvp-slim]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cache ~/.gradle so runs do not re-download dependencies — repeated
      # fresh downloads from the shared CI egress IPs are what draw Maven
      # Central's 429s (see core/settings.gradle.kts for the mirror set).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle check
        working-directory: core
        run: ./gradlew check --no-daemon

  check-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # Cache ~/.gradle (see the comment in the check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle check (Windows)
        working-directory: core
        shell: bash
        run: ./gradlew check --no-daemon
